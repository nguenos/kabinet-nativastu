<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход · Личный кабинет Nati Vastu</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  #login{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1100px 620px at 85% -10%,rgba(196,168,130,.16),transparent 60%),
      radial-gradient(760px 520px at 0% 108%,rgba(30,45,31,.06),transparent 55%),var(--bg);}
  .card{width:100%;max-width:432px;background:var(--bg);border:1px solid var(--border);
    border-radius:6px;padding:48px 42px 40px;box-shadow:0 30px 70px -34px rgba(30,45,31,.35);}
  .brand{text-align:center;margin-bottom:34px;}
  .brand .mark{font-size:34px;letter-spacing:.06em;text-transform:uppercase;color:var(--dark);line-height:1;}
  .brand .mark em{font-size:.62em;color:var(--gold);}
  .brand .sub{margin-top:12px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);font-weight:400;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:9px;font-weight:500;}
  .field input{width:100%;padding:14px 16px;font-size:15px;font-family:'Fira Sans';font-weight:300;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:3px;transition:all .2s;}
  .field input::placeholder{color:#b3a894;}
  .field input:focus{outline:none;border-color:var(--gold);background:#fff;}
  .field input.code{letter-spacing:8px;text-align:center;font-size:22px;font-weight:400;}
  .card .btn.pri{width:100%;padding:16px;}
  .note{text-align:center;margin-top:18px;font-size:12px;color:var(--muted);min-height:18px;}
  .note.err{color:var(--red);}
  .back{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--muted);text-decoration:none;}
  .back:hover{color:var(--gold);}
  .dev{margin-top:14px;padding:10px;border:1px dashed var(--border);border-radius:4px;text-align:center;font-size:12px;color:var(--accent2);background:var(--surface);display:none;}
  .step{display:none;}.step.active{display:block;}
  .sent-to{text-align:center;font-size:13px;color:var(--accent2);margin-bottom:22px;}
  .sent-to b{color:var(--text);font-weight:400;}
</style>
</head>
<body>
<section id="login">
  <div class="card">
    <div class="brand">
      <div class="mark bebas">Nati <em class="salina">Vastu</em></div>
      <div class="sub">Личный кабинет</div>
    </div>

    <!-- Шаг 1: email -->
    <form class="step active" id="stepEmail">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="name@example.com" autocomplete="email" required>
      </div>
      <button class="btn pri" type="submit" id="sendBtn">Получить код</button>
      <div class="note" id="note1"></div>
    </form>

    <!-- Шаг 2: код -->
    <form class="step" id="stepCode">
      <div class="sent-to">Код отправлен на <b id="emailEcho"></b></div>
      <div class="field">
        <label>Код из письма</label>
        <input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="______" autocomplete="one-time-code" required>
      </div>
      <button class="btn pri" type="submit" id="verifyBtn">Войти</button>
      <div class="dev" id="dev"></div>
      <div class="note" id="note2"></div>
      <a class="back" href="#" id="back">← изменить email</a>
    </form>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);
let email = '';

async function post(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return { status:r.status, data: await r.json().catch(()=>({})) };
}

$('stepEmail').addEventListener('submit', async (e) => {
  e.preventDefault();
  email = $('email').value.trim().toLowerCase();
  $('note1').textContent=''; $('note1').className='note';
  $('sendBtn').disabled=true; $('sendBtn').textContent='Отправляем...';
  const { status, data } = await post('/api/auth/request-code',{email});
  $('sendBtn').disabled=false; $('sendBtn').textContent='Получить код';
  if(status!==200){ $('note1').textContent='Проверьте адрес почты'; $('note1').className='note err'; return; }
  $('emailEcho').textContent = email;
  $('stepEmail').classList.remove('active'); $('stepCode').classList.add('active');
  $('code').focus();
  if(data.devCode){ $('dev').style.display='block'; $('dev').innerHTML='Демо-режим · ваш код: <b>'+data.devCode+'</b>'; }
});

$('stepCode').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = $('code').value.trim();
  $('note2').textContent=''; $('note2').className='note';
  $('verifyBtn').disabled=true; $('verifyBtn').textContent='Проверяем...';
  const { status } = await post('/api/auth/verify',{email,code});
  if(status===200){ location.href='/app'; return; }
  $('verifyBtn').disabled=false; $('verifyBtn').textContent='Войти';
  $('note2').textContent = 'Неверный или просроченный код'; $('note2').className='note err';
});

$('back').addEventListener('click',(e)=>{e.preventDefault();
  $('stepCode').classList.remove('active'); $('stepEmail').classList.add('active');
  $('dev').style.display='none'; $('note2').textContent='';});
</script>
</body>
</html>
