services:
  - type: web
    name: kabinet-nativastu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true          # Render сам сгенерирует секрет
      - key: ADMIN_EMAILS
        value: natiyaguenos@gmail.com
      # Почта (заполнить, когда будет SMTP):
      # - key: SMTP_HOST
      #   value: ""
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   value: ""
      # - key: SMTP_PASS
      #   value: ""
      # - key: MAIL_FROM
      #   value: "Nati Vastu <no-reply@nativastu.com>"
      # Prodamus (заполнить при подключении оплаты):
      # - key: PRODAMUS_SECRET
      #   value: ""
